version: 1
services:
  - type: web
    name: widowblue-web
    env: node
    # Scegli la region supportata dal tuo account (es. oregon, frankfurt, ireland...) o rimuovi la riga per usare il default
    region: oregon
    plan: free
    branch: main
    repo: https://github.com/damon969gin-droid/Widowblue
    # Forza l'installazione delle devDependencies quando Render usa yarn
    buildCommand: YARN_PRODUCTION=false yarn install --non-interactive && ls -la node_modules | grep tailwindcss || true && yarn build
    startCommand: yarn start -- -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: WIDOWBLUE_DB_PATH
        value: /data/widowblue.db
    disks:
      - name: widowblue-data
        mountPath: /data
        sizeGB: 1

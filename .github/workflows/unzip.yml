name: Estrai progetto da zip

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mostra contesto e file zip trovati
        run: |
          pwd
          ls -la
          echo "ZIP files:"
          ls -la *.zip || echo "Nessun .zip trovato"

      - name: Elenca e testa ZIP (debug)
        run: |
          for f in *.zip; do
            echo "=== $f ==="
            unzip -l "$f" || echo "impossibile elencare $f"
            unzip -t "$f" || echo "test fallito per $f"
          done

      - name: Estrai e sposta i file alla radice (gestisce root o folder unico)
        shell: bash
        run: |
          shopt -s dotglob
          for f in *.zip; do
            echo "Estrazione di $f"
            rm -rf estratto_tmp
            mkdir -p estratto_tmp
            unzip -oq "$f" -d estratto_tmp
            # Se estratto_tmp contiene una sola directory, sposta i suoi contenuti; altrimenti sposta tutto
            entries=(estratto_tmp/*)
            if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
              echo "Zip contiene una singola cartella, sposto il suo contenuto"
              mv "${entries[0]}"/* .
            else
              echo "Zip contiene file multipli, sposto tutto"
              mv estratto_tmp/* .
            fi
            rm -rf estratto_tmp "$f"
          done || true

      - name: Mostra contenuto dopo estrazione
        run: ls -la || true

      - name: Commit se ci sono cambi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare"
            exit 0
          fi
          git commit -m "Estratti i file del progetto dallo zip caricato"

      - name: Crea Pull Request con le modifiche (se presenti)
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Estratti i file del progetto dallo zip caricato"
          branch: extracted-files-${{ github.run_id }}
          title: "Estratti i file dal .zip"
          body: "Questo PR contiene i file estratti dallo zip caricato."
          labels: extracted
          base: main
